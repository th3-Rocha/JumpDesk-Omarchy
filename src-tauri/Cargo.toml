[package]
name = "jumpdesk"
version = "0.1.0"
description = "Acesso VPN + JumpCloud + RDP"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jumpdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
dirs = "5"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
totp-rs = { version = "5", features = ["otpauth"] }
data-encoding = "2"
thiserror = "2"
# leitura do QR exportado do Google Authenticator (otpauth-migration)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.9"
base64 = "0.22"
urlencoding = "2"
tauri-plugin-dialog = "2.8.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# layout do portal embutido (caixa GTK da janela; ver portal::gtk_layout)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
